name: integration

# Full checks on both supported local platforms; real OpenSSH on Linux hosts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch: {}

jobs:
  unit:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-unit
          - os: ubuntu-latest
            name: linux-unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Unit, race, vet, and format
        run: ./scripts/check

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Integration suites (disposable containers)
        run: ./scripts/test-integration

      - name: Verify Docker is spotless afterwards
        run: |
          containers=$(docker ps -a --format '{{.Names}}' | grep -c ssh-forward || true)
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -c ssh-forward || true)
          networks=$(docker network ls --format '{{.Name}}' | grep -c ssh-forward || true)
          echo "leftovers: containers=$containers images=$images networks=$networks"
          test "$containers" = 0 && test "$images" = 0 && test "$networks" = 0
