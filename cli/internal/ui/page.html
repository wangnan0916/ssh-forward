<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ssh-forward</title>
  <style>
    :root {
      --gray-50: #fafafa;
      --gray-100: #f4f4f5;
      --gray-200: #e4e4e7;
      --gray-500: #71717a;
      --gray-600: #52525b;
      --gray-800: #27272a;
      --gray-900: #18181b;
      --gray-950: #09090b;
      --green-600: #16a34a;
      --amber-600: #d97706;
      --red-600: #dc2626;
      --color-bg: var(--gray-50);
      --color-surface: #fff;
      --color-sunken: var(--gray-50);
      --color-text: var(--gray-900);
      --color-text-secondary: var(--gray-600);
      --color-text-tertiary: var(--gray-500);
      --color-border: var(--gray-200);
      --color-accent-solid: var(--gray-900);
      --color-accent-text: #fff;
      --color-accent-hover: var(--gray-800);
      --color-danger-text: var(--red-600);
      --color-success: var(--green-600);
      --color-warning: var(--amber-600);
      --color-danger-bg: #fef2f2;
      --color-success-bg: #ecfdf3;
      --color-warning-bg: #fffbeb;
      --color-overlay: rgb(24 24 27 / 0.4);
      --color-control-hover: var(--gray-100);
      --radius-sm: 6px;
      --radius-lg: 12px;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #000;
        --color-surface: var(--gray-950);
        --color-sunken: #050505;
        --color-text: #ededed;
        --color-text-secondary: #a1a1aa;
        --color-text-tertiary: #71717a;
        --color-border: #27272a;
        --color-accent-solid: #ededed;
        --color-accent-text: var(--gray-950);
        --color-accent-hover: #fff;
        --color-danger-text: #f87171;
        --color-success: #4ade80;
        --color-warning: #fbbf24;
        --color-danger-bg: #2a1215;
        --color-success-bg: #0b1f14;
        --color-warning-bg: #231c0a;
        --color-overlay: rgb(0 0 0 / 0.6);
        --color-control-hover: #141414;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { color-scheme: light dark; }
    body {
      font: 13px/1.45 var(--font);
      color: var(--color-text);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    :focus-visible { outline: 2px solid var(--color-text); outline-offset: 2px; }
    .skip {
      position: absolute;
      inset-inline-start: 12px;
      top: 8px;
      z-index: 2;
      padding: 8px 12px;
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: var(--radius-sm);
      transform: translateY(-200%);
    }
    .skip:focus { transform: none; }
    .shell {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .wordmark {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--color-text-secondary);
    }
    .host {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.1;
      text-wrap: balance;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 6px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-tertiary);
      flex: 0 0 auto;
    }
    .pill.ok .dot { background: var(--color-success); }
    .pill.warn .dot { background: var(--color-warning); }
    .pill.bad .dot { background: var(--color-danger-text); }
    .composer {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 28px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label {
      color: var(--color-text-secondary);
      font-size: 12px;
      font-weight: 500;
    }
    .field input {
      width: 8.5rem;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-sunken);
      color: var(--color-text);
      font: 16px/1.3 var(--mono);
      font-variant-numeric: tabular-nums;
    }
    @media (min-width: 640px) {
      .field input { font-size: 13px; }
    }
    .field input::placeholder { color: var(--color-text-tertiary); opacity: 0.65; }
    button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
      font: 500 13px/1.2 var(--font);
      cursor: pointer;
      transition-property: background-color, border-color, color, transform;
      transition-duration: 120ms;
      transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
    }
    @media (hover: hover) {
      button:not(.tab):hover { background: var(--color-control-hover); }
    }
    @media (prefers-reduced-motion: no-preference) {
      button:not(.tab):active { transform: scale(0.96); }
    }
    button.primary {
      background: var(--color-accent-solid);
      color: var(--color-accent-text);
      border-color: var(--color-accent-solid);
    }
    @media (hover: hover) {
      button.primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
    }
    button.danger {
      color: var(--color-danger-text);
      background: transparent;
    }
    button.ghost { background: transparent; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin: 0;
      padding: 0 8px;
      border-bottom: 1px solid var(--color-border);
    }
    .tab {
      min-height: 40px;
      padding: 8px 10px 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--color-text-secondary);
      font-weight: 500;
    }
    .tab[aria-selected="true"] {
      color: var(--color-text);
      border-bottom-color: var(--color-text);
    }
    .count {
      display: inline-block;
      min-width: 1.15rem;
      margin-inline-start: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--color-sunken);
      color: var(--color-text-secondary);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 500;
    }
    .tab-alert .count {
      color: var(--color-danger-text);
      background: var(--color-danger-bg);
    }
    .frame {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 16px;
      align-items: center;
      min-height: 69px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
    }
    .row:last-child { border-bottom: 0; }
    @media (hover: hover) {
      .row:hover { background: var(--color-sunken); }
    }
    .row-identity {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      min-width: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px 2px 6px;
      border-radius: 999px;
      background: var(--color-sunken);
      color: var(--color-text-secondary);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
    }
    .badge .dot { width: 6px; height: 6px; }
    .badge.ok { background: var(--color-success-bg); color: var(--color-success); }
    .badge.ok .dot { background: var(--color-success); }
    .badge.warn { background: var(--color-warning-bg); color: var(--color-warning); }
    .badge.warn .dot { background: var(--color-warning); }
    .badge.bad { background: var(--color-danger-bg); color: var(--color-danger-text); }
    .badge.bad .dot { background: var(--color-danger-text); }
    .port {
      font: 600 16px/1.2 var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .map {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--color-text-secondary);
    }
    .map-arrow {
      color: var(--color-text-tertiary);
      font-size: 12px;
    }
    .local {
      padding: 0 8px;
      border-radius: var(--radius-sm);
      background: var(--color-sunken);
      color: var(--color-text);
      font: 500 12px/1.2 var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .meta {
      margin-top: 4px;
      color: var(--color-text-tertiary);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .row-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .row-actions button { min-height: 32px; padding: 4px 10px; }
    .empty {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 69px;
      padding: 14px 20px;
      text-align: center;
    }
    .empty h2 {
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .empty p {
      margin: 0;
      color: var(--color-text-secondary);
      text-wrap: pretty;
    }
    .toast {
      min-height: 1.45em;
      margin-top: 16px;
      color: var(--color-text-secondary);
    }
    .confirm {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--color-overlay);
      z-index: 3;
    }
    .confirm[hidden] { display: none; }
    .dialog {
      width: min(100%, 360px);
      padding: 20px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
    }
    .dialog h2 { margin: 0 0 8px; font-size: 16px; letter-spacing: -0.03em; }
    .dialog p { margin: 0 0 16px; color: var(--color-text-secondary); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    @media (max-width: 520px) {
      .shell { padding: 20px 16px 40px; }
      .host { font-size: 22px; }
      .pills { justify-content: flex-start; }
      .row { padding: 12px; }
      .row-actions { align-self: start; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to ports</a>
  <div class="shell">
    <header>
      <div class="brand">
        <p class="wordmark">ssh-forward</p>
        <h1 class="host" id="host">Connecting</h1>
      </div>
      <div class="pills" id="pills"></div>
    </header>
    <form class="composer" id="port-form">
      <div class="field">
        <label for="port-input">Remember port</label>
        <input id="port-input" name="port" inputmode="numeric" maxlength="5" placeholder="e.g. 5173" autocomplete="off" spellcheck="false">
      </div>
      <button class="primary" type="submit">Remember</button>
      <button class="ghost" type="button" id="forget-typed">Forget</button>
    </form>
    <div class="frame">
      <div class="tabs" id="tabs" role="tablist" aria-label="Port lists"></div>
      <main id="main">
        <div id="panel" role="tabpanel">
          <div class="empty"><h2>Loading</h2><p>Reading the current host snapshot.</p></div>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <div class="confirm" id="confirm" hidden>
    <div class="dialog" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <h2 id="confirm-title">Forget this port?</h2>
      <p id="confirm-body"></p>
      <div class="dialog-actions">
        <button type="button" class="ghost" id="confirm-no">Cancel</button>
        <button type="button" class="danger" id="confirm-yes">Forget port</button>
      </div>
    </div>
  </div>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
if (token) history.replaceState(null, "", location.pathname);
const withToken = (path) => token ? path + "?token=" + encodeURIComponent(token) : path;
const api = (path, opts) => fetch(withToken(path), opts);
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const emptyCopy = {
  attention: ["No ports need attention", "Local port conflicts will show up here."],
  active: ["No forwards yet", "Remember a remote port to expose it on this machine."],
  waiting: ["Nothing waiting", "Remembered ports appear here until something listens."],
  available: ["No other listeners", "Observed ports that are not forwarded stay in this list."],
};
let view = "";
let snap = { host: null, lists: {}, remembered_ports: [] };
let pendingForget = 0;
let confirmReturn = null;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ESC[ch]);
}

function toneOf(value) {
  switch (value) {
    case "connected":
    case "healthy":
    case "active":
      return "ok";
    case "connecting":
    case "degraded":
    case "starting":
    case "waiting":
    case "unclassified":
      return "warn";
    case "disconnected":
    case "failed":
    case "stopped":
    case "conflict":
      return "bad";
    default:
      return "";
  }
}

function renderPills(host) {
  if (!host) {
    document.getElementById("pills").innerHTML = `<span class="pill warn"><span class="dot" aria-hidden="true"></span>no Development Host</span>`;
    return;
  }
  const items = [
    { label: host.connection, tone: toneOf(host.connection) || "bad" },
    { label: "Discovery " + (host.discovery || ""), tone: toneOf(host.discovery) },
  ];
  if (host.connection_diagnostic) items.push({ label: host.connection_diagnostic, tone: "bad" });
  if (host.discovery_diagnostic) items.push({ label: host.discovery_diagnostic, tone: "warn" });
  if (host.policy_diagnostic) items.push({ label: host.policy_diagnostic, tone: "warn" });
  document.getElementById("pills").innerHTML = items.map((item) =>
    `<span class="pill ${item.tone}"><span class="dot" aria-hidden="true"></span>${esc(item.label)}</span>`
  ).join("");
}

function listsOf(doc) {
  const lists = doc.lists || {};
  return {
    attention: lists.attention || [],
    active: lists.active || [],
    waiting: lists.waiting || [],
    available: lists.available || [],
  };
}

function pickView(doc) {
  const lists = listsOf(doc);
  for (const id of ["attention", "active", "waiting", "available"]) {
    if (lists[id].length) return id;
  }
  return "active";
}

function rowHTML(row, remembered) {
  const bits = [];
  if (row.exe) bits.push(esc(row.exe));
  if (row.cwd) bits.push(esc(row.cwd));
  if (row.policy_id) bits.push(esc(row.policy_id));
  const local = row.local ? "127.0.0.1:" + row.local : "";
  const status = row.reason || row.state;
  const kind = toneOf(row.state) || toneOf(row.reason);
  const action = remembered
    ? `<button type="button" class="danger" data-forget="${row.port}">Forget</button>`
    : `<button type="button" class="primary" data-remember="${row.port}">Remember</button>`;
  return `<div class="row">
    <div>
      <div class="row-identity">
        ${status ? `<span class="badge${kind ? " " + kind : ""}"><span class="dot" aria-hidden="true"></span>${esc(status)}</span>` : ""}
        <span class="port">${row.port}</span>
        ${local ? `<span class="map"><span class="map-arrow" aria-hidden="true">→</span><span class="local">${local}</span></span>` : ""}
      </div>
      ${bits.length ? `<div class="meta">${bits.join(" · ")}</div>` : ""}
    </div>
    <div class="row-actions">${action}</div>
  </div>`;
}

function render() {
  const host = snap.host;
  document.getElementById("host").textContent = host ? host.alias : "ssh-forward";
  renderPills(host);
  const lists = listsOf(snap);
  const tabs = [
    ["attention", "Attention", lists.attention.length],
    ["active", "Active", lists.active.length],
    ["waiting", "Remembered", lists.waiting.length],
    ["available", "Available", lists.available.length],
  ];
  document.getElementById("tabs").innerHTML = tabs.map(([id, title, n]) =>
    `<button type="button" class="tab${id === "attention" && n ? " tab-alert" : ""}" role="tab" id="tab-${id}" data-view="${id}" aria-selected="${id === view}" aria-controls="panel">${esc(title)}<span class="count">${n}</span></button>`
  ).join("");
  const rows = lists[view] || [];
  const remembered = new Set(snap.remembered_ports || []);
  const panel = document.getElementById("panel");
  panel.setAttribute("aria-labelledby", "tab-" + view);
  if (!rows.length) {
    const [title, body] = emptyCopy[view];
    panel.innerHTML = `<div class="empty"><h2>${title}</h2><p>${body}</p></div>`;
    return;
  }
  panel.innerHTML = rows.map((row) => rowHTML(row, remembered.has(row.port))).join("");
}

function applyView(doc) {
  snap = doc;
  if (!view) view = pickView(doc);
  render();
}

function toast(message) {
  document.getElementById("toast").textContent = message;
}

async function refresh() {
  const res = await api("/api/snapshot");
  if (res.status === 401) {
    toast("Open this page from the URL printed by ssh-forward ui.");
    return;
  }
  applyView(await res.json());
}

async function post(path, port) {
  const res = await api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ port }),
  });
  const body = await res.json();
  if (body.error) toast(body.error);
  else if (body.removed) toast("Forgot " + port);
  else if (body.added === false) toast("Already remembered " + port);
  else toast("Remembered " + port);
  await refresh();
}

function readPort(form) {
  return Number(form.port.value);
}

function openConfirm(port, trigger) {
  pendingForget = port;
  confirmReturn = trigger;
  document.getElementById("confirm-body").textContent = "This drops the remembered Auto-forward for port " + port + ".";
  document.getElementById("confirm").hidden = false;
  document.querySelector(".shell").inert = true;
  document.getElementById("confirm-no").focus();
}

function closeConfirm() {
  document.getElementById("confirm").hidden = true;
  document.querySelector(".shell").inert = false;
  pendingForget = 0;
  if (confirmReturn) confirmReturn.focus();
  confirmReturn = null;
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const tab = e.target.closest("[data-view]");
  if (!tab) return;
  view = tab.getAttribute("data-view");
  render();
});
document.getElementById("tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const tabs = [...e.currentTarget.querySelectorAll("[data-view]")];
  const i = tabs.findIndex((tab) => tab.getAttribute("data-view") === view);
  const next = e.key === "ArrowRight" ? (i + 1) % tabs.length : (i - 1 + tabs.length) % tabs.length;
  view = tabs[next].getAttribute("data-view");
  render();
  document.querySelector(`[data-view="${view}"]`).focus();
});
document.getElementById("panel").addEventListener("click", (e) => {
  const rem = e.target.closest("[data-remember]");
  if (rem) { post("/api/remember", Number(rem.getAttribute("data-remember"))); return; }
  const fg = e.target.closest("[data-forget]");
  if (fg) openConfirm(Number(fg.getAttribute("data-forget")), fg);
});
document.getElementById("port-form").addEventListener("submit", (e) => {
  e.preventDefault();
  post("/api/remember", readPort(e.target));
});
document.getElementById("forget-typed").addEventListener("click", () => {
  const port = readPort(document.getElementById("port-form"));
  if (port) openConfirm(port, document.getElementById("forget-typed"));
});
document.getElementById("confirm-no").addEventListener("click", closeConfirm);
document.getElementById("confirm-yes").addEventListener("click", () => {
  const port = pendingForget;
  closeConfirm();
  post("/api/forget", port);
});
document.getElementById("confirm").addEventListener("click", (e) => {
  if (e.target.id === "confirm") closeConfirm();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !document.getElementById("confirm").hidden) closeConfirm();
});

refresh().catch((err) => toast(String(err)));
const events = new EventSource(withToken("/api/watch"));
events.onmessage = (ev) => {
  try { applyView(JSON.parse(ev.data)); } catch (err) { toast(String(err)); }
};
</script>
</body>
</html>
